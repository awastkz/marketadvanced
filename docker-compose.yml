# общее окружение для контейнеров сервисов
x-app-env: &app-env
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
  ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__User: ${RABBITMQ_USER}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD}
  RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
  Minio__InternalEndpoint: "http://minio:9000"
  Minio__PublicEndpoint: "http://localhost:${MINIO_PORT}"
  Minio__AccessKey: ${MINIO_AVATARS_ACCESS_KEY}
  Minio__SecretKey: ${MINIO_AVATARS_SECRET_KEY}
  Minio__Bucket: "marketadvanced"
  # Hangfire хранит задачи в том же Postgres, в схеме hangfire
  Hangfire__Schema: hangfire
  Catalog__BaseUrl: "http://catalog:8080"
  # внутри docker Keycloak доступен как keycloak:8080; issuer в токене остаётся localhost (Keycloak__Issuer в appsettings)
  Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketadvanced/.well-known/openid-configuration"
  # телеметрия в otel-collector (override для dev), дальше Prometheus + Loki + Grafana
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # каждый сервис поднимает свои консьюмеры MassTransit
  MassTransit__Consumers: "true"
  MassTransit__PrefetchCount: ${MASSTRANSIT_PREFETCH_COUNT:-16}

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio:
    condition: service_healthy

# общая часть контейнера сервиса: один образ Host, сервис выбирается через Services__0
x-app: &app
  build:
    context: ./src
    dockerfile: Host/Dockerfile
  restart: unless-stopped
  depends_on: *app-depends

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # pg_stat_statements: статистика по запросам для поиска узких мест (select * from pg_stat_statements)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # создаёт базу keycloak; скрипты выполняются только на пустом томе, на существующем — createdb руками
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    # start-dev: http без TLS и без кеша тем — только для разработки. В проде: start + TLS
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # админ создаётся при первом старте, потом логин/пароль меняются в консоли
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # адрес, который видит браузер; он же попадает в токен как issuer
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT}"
      # api внутри docker ходит на http://keycloak:8080, а issuer остаётся localhost
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      # realm из репозитория импортируется при старте, если его ещё нет
      - ./ops/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # в образе нет curl, проверяем /health/ready на management-порту через bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Каждый сервис в своём контейнере из одного образа: Services__0 выбирает сервис.
  # Один сервис = один DbContext в процессе, поэтому у каждого может быть свой outbox MassTransit.
  # Консьюмеры тоже живут в контейнере своего сервиса и читают только свои очереди.
  identity:
    <<: *app
    environment:
      <<: *app-env
      Service__Name: identity
      Services__0: Identity

  catalog:
    <<: *app
    environment:
      <<: *app-env
      Service__Name: catalog
      Services__0: Catalog
    ports:
      # фронт ходит в Catalog напрямую (VITE_CATALOG_API_BASE_URL), остальные сервисы через gateway
      - "${CATALOG_PORT:-5081}:8080"

  cart:
    <<: *app
    environment:
      <<: *app-env
      Service__Name: cart
      Services__0: Cart

  order:
    <<: *app
    environment:
      <<: *app-env
      Service__Name: order
      Services__0: Order

  payment:
    <<: *app
    environment:
      <<: *app-env
      Service__Name: payment
      Services__0: Payment

  # единая точка входа для фронта на API_PORT: раскидывает /api/... по сервисам, см. ops/gateway/nginx.conf
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./ops/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity
      - cart
      - order
      - payment
    ports:
      - "${API_PORT}:80"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
