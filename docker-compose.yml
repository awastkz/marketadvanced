# общее окружение и зависимости для api и worker
x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
  ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__User: ${RABBITMQ_USER}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD}
  RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
  Minio__InternalEndpoint: "http://minio:9000"
  Minio__PublicEndpoint: "http://localhost:${MINIO_PORT}"
  Minio__AccessKey: ${MINIO_AVATARS_ACCESS_KEY}
  Minio__SecretKey: ${MINIO_AVATARS_SECRET_KEY}
  Minio__Bucket: "marketadvanced"
  # Hangfire хранит задачи в том же Postgres, в схеме hangfire
  Hangfire__Schema: hangfire
  Catalog__BaseUrl: "http://catalog:8080"
  # телеметрия в otel-collector (override для dev), дальше Prometheus + Loki + Grafana
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # pg_stat_statements: статистика по запросам для поиска узких мест (select * from pg_stat_statements)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src
      dockerfile: Host/Dockerfile
    restart: unless-stopped
    depends_on: *app-depends
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:8080
      Service__Name: api
      # все сервисы, кроме Catalog: он живёт в отдельном контейнере catalog
      Services__0: Identity
      Services__1: Cart
      Services__2: Order
      Services__3: Payment
      # api только ставит задачи и показывает дашборд /hangfire, сервер Hangfire не запускает
      Hangfire__Server: "false"
      # api только публикует сообщения в RabbitMQ, консьюмеры MassTransit не поднимает
      MassTransit__Consumers: "false"
    ports:
      - "${API_PORT}:8080"

  # тот же образ, но поднимает только сервис Catalog; api и worker ходят в него по http://catalog:8080
  catalog:
    build:
      context: ./src
      dockerfile: Host/Dockerfile
    restart: unless-stopped
    depends_on: *app-depends
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:8080
      Service__Name: catalog
      Services__0: Catalog
      Hangfire__Server: "false"
      MassTransit__Consumers: "false"
    ports:
      - "${CATALOG_PORT:-5081}:8080"

  # тот же образ, что и api, но выполняет только фоновые задачи Hangfire
  # и консьюмеры MassTransit (без HTTP наружу)
  worker:
    build:
      context: ./src
      dockerfile: Host/Dockerfile
    restart: unless-stopped
    depends_on: *app-depends
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:8080
      Service__Name: worker
      # сервисы, у которых есть фоновые задачи или консьюмеры
      Services__0: Cart
      Services__1: Order
      Services__2: Payment
      Hangfire__Server: "true"
      Hangfire__WorkerCount: ${HANGFIRE_WORKER_COUNT:-4}
      MassTransit__Consumers: "true"
      MassTransit__PrefetchCount: ${MASSTRANSIT_PREFETCH_COUNT:-16}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
