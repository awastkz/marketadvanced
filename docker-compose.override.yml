services:
  # Dev: один процесс со всеми сервисами (app) вместо пяти dotnet watch, каждый из которых
  # держит свой компилятор и MSBuild (~2.5 ГБ на контейнер). Контейнеры сервисов и gateway ниже выключены профилем.
  # Проверить раздельную топологию как в проде: docker compose -f docker-compose.yml up --build
  app:
    # окружение, образ-заготовка и порт Catalog берутся из catalog в docker-compose.yml
    extends:
      file: docker-compose.yml
      service: catalog
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - app_artifacts:/src/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Service__Name: app
      # все сервисы; Services__0 из catalog перезаписывается
      Services__0: Identity
      Services__1: Catalog
      Services__2: Cart
      Services__3: Order
      Services__4: Payment
      # Cart ходит в Catalog по HTTP в тот же процесс
      Catalog__BaseUrl: "http://localhost:8080"
    ports:
      # вместо gateway: фронт ходит и на API_PORT, и на CATALOG_PORT (он унаследован от catalog) в этот же процесс
      - "${API_PORT}:8080"
    healthcheck: &dev-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s   # dotnet watch собирает проект при старте

  identity:
    profiles: ["split"]   # в dev сервис поднят внутри app, см. комментарий вверху
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - identity_artifacts:/src/artifacts
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    healthcheck: *dev-healthcheck

  catalog:
    profiles: ["split"]   # в dev сервис поднят внутри app, см. комментарий вверху
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - catalog_artifacts:/src/artifacts
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    healthcheck: *dev-healthcheck

  cart:
    profiles: ["split"]   # в dev сервис поднят внутри app, см. комментарий вверху
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - cart_artifacts:/src/artifacts
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    healthcheck: *dev-healthcheck

  order:
    profiles: ["split"]   # в dev сервис поднят внутри app, см. комментарий вверху
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - order_artifacts:/src/artifacts
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    healthcheck: *dev-healthcheck

  payment:
    profiles: ["split"]   # в dev сервис поднят внутри app, см. комментарий вверху
    build:
      context: ./src
      dockerfile: Host/Dockerfile.dev
    volumes:
      - ./src:/src
      - payment_artifacts:/src/artifacts
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    healthcheck: *dev-healthcheck

  gateway:
    profiles: ["split"]   # в dev app сам отвечает на API_PORT

  # Aspire Dashboard отключён в пользу Grafana-стека ниже. Чтобы вернуть: раскомментировать
  # и переключить OTEL_EXPORTER_OTLP_ENDPOINT в docker-compose.yml на http://aspire-dashboard:18889
  # aspire-dashboard:
  #   image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
  #   environment:
  #     DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
  #   ports:
  #     - "18888:18888"   # UI
  #     - "18889:18889"   # OTLP gRPC

  # ---- Наблюдаемость: OTel Collector -> Prometheus (метрики) + Loki (логи), Grafana как UI ----
  # Grafana: http://localhost:3000 (без логина). Трассы хранит Tempo.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC, для запуска api с хоста через dotnet run
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  # Метрики: принимает OTLP от collector и remote write от k6, сам опрашивает cadvisor и postgres-exporter
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver   # сюда k6 пишет свои метрики (ops/k6/run.sh)
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # CPU и память каждого контейнера: container_* в Prometheus
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8085:8080"

  # Соединения, транзакции, размер БД: pg_* в Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"

  # Команды, память, клиенты Redis: redis_* в Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9121:9121"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./ops/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  app_artifacts:
  identity_artifacts:
  catalog_artifacts:
  cart_artifacts:
  order_artifacts:
  payment_artifacts:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
