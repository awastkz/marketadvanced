# Gateway на API_PORT: фронт ходит в один адрес, запрос уходит в контейнер нужного сервиса.
# Catalog открыт на своём порту (CATALOG_PORT), через gateway не проходит.

# DNS docker: адреса сервисов резолвятся на каждый запрос, поэтому gateway стартует,
# даже если сервис ещё не поднялся, и видит новый IP после перезапуска контейнера
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # импорт CSV и загрузка файлов
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $identity http://identity:8080;
    set $cart     http://cart:8080;
    set $order    http://order:8080;
    set $payment  http://payment:8080;

    # /api/cart..., /api/admin/carts...
    location ~ ^/api/(admin/carts|cart)(/|$) {
        proxy_pass $cart;
    }

    # /api/orders..., /api/admin/orders...
    location ~ ^/api/(admin/)?orders(/|$) {
        proxy_pass $order;
    }

    # /api/payments..., /api/admin/payments...
    location ~ ^/api/(admin/)?payments(/|$) {
        proxy_pass $payment;
    }

    # всё остальное: auth, login/refresh, users, admin/users
    location / {
        proxy_pass $identity;
    }
}
